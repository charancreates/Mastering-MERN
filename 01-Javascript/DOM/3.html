<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dom adding elements</title>
  </head>
  <body style="background-color: #212121; color: white"></body>
  <script>
    const div = document.createElement("div");
    div.className = "main";
    div.id = Math.round(Math.random() * 10 + 1);
    console.log(div);
    div.setAttribute("title", "idk man");
    div.style.backgroundColor = "orange";
    div.innerText = "Yo yo man";

    // const addText = document.createTextNode("yo this is node");
    // div.appendChild(addText);

    document.body.appendChild(div);
  </script>
</html>
